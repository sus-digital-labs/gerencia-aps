# SSH config para parceiro - e-SUS PEC (host anton)
# Copiar este conteúdo para ~/.ssh/config no computador do parceiro

# Usuário Linux: esus-feedback
# Permissão de sistema: sudo completo (sem usar root direto)
# Usuário PostgreSQL criado: esus_feedback
# Permissão no PostgreSQL: sem restrições (SUPERUSER)

Host esus-feedback-anton
    HostName 45.39.210.223
    User esus-feedback
    Port 22
    PreferredAuthentications password,publickey
    PubkeyAuthentication yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    TCPKeepAlive yes
    Compression yes
    StrictHostKeyChecking accept-new

Host esus-feedback-anton-2222
    HostName 45.39.210.223
    User esus-feedback
    Port 2222
    PreferredAuthentications password,publickey
    PubkeyAuthentication yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    TCPKeepAlive yes
    Compression yes
    StrictHostKeyChecking accept-new
