name: Container security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release image
        run: docker build --pull --file docker/Dockerfile --tag sus-analytics-web:ci .

      - name: Scan high and critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --no-progress sus-analytics-web:ci

      - name: Validate container health
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fixture=$(mktemp -d)
          cleanup() {
            docker stop sus-analytics-health >/dev/null 2>&1 || true
            rm -f -- "$fixture/verifier" "$fixture/email" "$fixture/password"
            rmdir -- "$fixture"
          }
          trap cleanup EXIT
          printf '%s\n' 'health-probe@example.test' >"$fixture/email"
          openssl rand -hex 24 >"$fixture/password"
          docker run --rm -i --network none --user "$(id -u):$(id -g)" --entrypoint node \
            --mount "type=bind,source=$PWD/apps/backend/local/operator-auth.ts,target=/operator-auth.mts,readonly" \
            --mount "type=bind,source=$fixture,target=/fixture,readonly" sus-analytics-web:ci --input-type=module >"$fixture/verifier" <<'NODE'
          import { buildOperatorVerifier } from "/operator-auth.mts";
          process.stdout.write(JSON.stringify(await buildOperatorVerifier("/fixture/email", "/fixture/password")));
          NODE
          docker run --rm --detach --network none --name sus-analytics-health --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$fixture/verifier,target=/run/secrets/operator_login,readonly" sus-analytics-web:ci
          for _ in {1..15}; do
            if docker exec sus-analytics-health node -e "fetch('http://127.0.0.1:3000/healthz').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs sus-analytics-health
          exit 1

      - name: Generate SPDX SBOM
        run: |
          mkdir -p security-artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security-artifacts:/out" \
            anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            sus-analytics-web:ci -o spdx-json=/out/sbom.spdx.json
          test -s security-artifacts/sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sus-analytics-web-sbom
          path: security-artifacts/sbom.spdx.json
          if-no-files-found: error
