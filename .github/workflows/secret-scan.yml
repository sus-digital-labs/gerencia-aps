name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits with Gitleaks
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          range=$HEAD_REVISION
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
            range="$BASE_REVISION..$HEAD_REVISION"
          fi
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --log-opts="$range" --redact=100 --no-banner
